# Repo tts-gpu-worker (dùng lại secret Docker Hub) — nay build image `ardy-render`:
# câu tiếng Anh → LLM2Vec → ARDY → clip chuẩn kho → R2. Nguồn thật ở repo 3d_chatbot `ardy_server/ardy_render/`.
#
# Image ~20 GB (Llama-3-8B nướng sẵn): runner ubuntu-latest chỉ ~21 GB trống → gộp đĩa root + /mnt bằng LVM trước khi
# build, và KHÔNG dùng cache gha (giới hạn 10 GB, lớp trọng số 15 GB không vào được — ghi cache chỉ tốn giờ build).
name: build-ardy-render
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Gộp đĩa runner (root + /mnt) cho Docker
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          swap-size-mb: 1024
          build-mount-path: /var/lib/docker
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
      - name: Khởi động lại Docker trên ổ đã gộp
        run: |
          sudo systemctl restart docker
          df -h / /var/lib/docker
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ardy-render:latest
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ardy-render:${{ github.sha }}
      - name: Kích thước image
        run: docker image inspect docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ardy-render:${{ github.sha }} --format '{{.Size}}' | awk '{printf "image %.1f GB\n", $1/1e9}'
